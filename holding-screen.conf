# Holding screen settings. Installed to /etc/holding-screen.conf
# After changing: sudo systemctl restart holding-screen

# Folder shared to the church PC (Samba share "Holding Screen")
IMAGE_DIR=/srv/holding-screen/images

# Shown when the shared folder has no images. Not inside the share, so it can't be deleted by accident.
DEFAULT_IMAGE=/opt/holding-screen/default.png

# yes = when a new image is dropped in, older ones move to "Previous images",
#       so deleting the image always goes straight back to the default.
# no  = keep everything; the newest image shows, delete it to fall back to the next newest.
KEEP_ONLY_LATEST=yes

# mpv video output. drm works on Pi OS Lite with no desktop.
MPV_VO=drm

# Safety net: re-check the folder this often (seconds) even if no change was seen.
RESCAN_SECONDS=30
